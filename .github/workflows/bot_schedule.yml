name: Cloud Trading Bot

on:
  schedule:
    # Uruchamia się raz dziennie o 21:30 UTC (po zamknięciu giełdy w USA)
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v3

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Zainstaluj biblioteki
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Uruchom bota tradingowego
        env:
          # Tutaj przekazujemy sekrety z GitHuba do zmiennych środowiskowych
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python alpaca_bot.py